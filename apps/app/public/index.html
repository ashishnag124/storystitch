<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b1340" />
    <link rel="stylesheet" href="/fonts/bricolage-grotesque.css" />
    <title>StoryStitch</title>
    <style>
      /* What a browser needs and React Native has no style for. Values from src/theme.ts. */
      :root {
        font-family: "Bricolage Grotesque Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
        accent-color: #ffc24b;
        color: #fff4e8;
        background: #2b1340;
        -webkit-text-size-adjust: 100%;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: flex; }
      /* min-width: 0 stops a wide scrolling strip from stretching the page past the screen. */
      #root { display: flex; flex: 1; min-width: 0; height: 100%; }
      :focus-visible { outline: 3px solid #ffc24b; outline-offset: 2px; }
      /* Headings take focus when a screen opens, for screen readers, but aren't controls. */
      [role="heading"]:focus { outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

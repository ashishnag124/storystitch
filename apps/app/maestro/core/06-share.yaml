appId: com.ashishnag.storystitch.staging
name: AC-IOS-06 Share opens the share sheet with a JPEG or a PNG
---
- runFlow: ../shared/pick-photos.yaml
- tapOn: Export
- extendedWaitUntil:
    visible: Share
    timeout: 20000
- tapOn: Share
# iOS fills in the sheet from another process. Until then it shows "storystitch.jpg", then "storystitch" and
# "JPEG Image · 286 KB", and on CI that can take over a minute, so either one counts.
- extendedWaitUntil:
    visible: "(storystitch\\.jpg|JPEG Image.*)"
    timeout: 60000
# Tapping outside the sheet closes it, and the tap also reaches the app, so use the empty part of the header.
- tapOn:
    point: "40%,10%"
# Share doesn't wait for the new image: a tap straight away still gets the PNG.
- tapOn: PNG
- tapOn: Share
- extendedWaitUntil:
    visible: "(storystitch\\.png|PNG Image.*)"
    timeout: 60000

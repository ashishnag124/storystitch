appId: com.ashishnag.storystitch.staging
name: AC-IOS-05 Tapping a photo offers zoom, and Fit undoes it
---
- runFlow: ../shared/pick-photos.yaml
# The app's first choice depends on the photos, and a tap can land between cells of some layouts.
- tapOn: "Grid, space above"
# CI's simulator can be slow enough to lose this tap. A tap that lands selects the photo, so the retry only runs after a miss.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "Story preview.*"
          point: "30%,45%"
      - assertVisible: "Tap another photo to swap them.*"
- swipe:
    start: "60%,84%"
    end: "85%,84%"
    duration: 600
- assertVisible: "4.0×"
- tapOn: Fit
- assertNotVisible: "4.0×"
- tapOn: Done
- assertNotVisible: "Tap another photo to swap them.*"

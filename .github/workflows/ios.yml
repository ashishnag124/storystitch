name: iOS

# Grades the `ios` criteria on a simulator. It stays out of ci.yml, like mobile.yml, so a failed or slow iOS run
# can't block a web or API release. This is the slow tier: pull requests into main, nightly on dev, and pull requests
# labeled run-sim. Pushes to main don't run it: the promotion PR already tested that code, and nothing depends on a
# run on the merge commit. ci.yml still runs on those pushes, because releases and deploys do depend on that.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "scripts/qa.mjs"
      - ".github/workflows/ios.yml"
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'run-sim')
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_VARIANT: staging
      # Compiled into the Release bundle. Nothing listens here: the core flows need no API.
      EXPO_PUBLIC_API_URL: http://localhost:3001
      EXPO_PUBLIC_WEB_URL: http://localhost:5174
      EXPO_PUBLIC_FEATURE_ACCOUNTS: "true"
      EXPO_PUBLIC_FEATURE_LAYOUT_EDITOR: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs start on main, the default branch. Nightly is for what hasn't been promoted yet.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: brew install mobile-dev-inc/tap/maestro
      - run: pnpm run prebuild:ios
        working-directory: apps/app
      - name: Build for the simulator
        working-directory: apps/app/ios
        run: >-
          xcodebuild -workspace StoryStitchStaging.xcworkspace -scheme StoryStitchStaging -configuration Release
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/build"
          CODE_SIGNING_ALLOWED=NO -quiet
      # A Pro: the flows' sliders are at percentages of its screen shape.
      - name: Boot a simulator with test photos
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone.* Pro$"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/build/Build/Products/Release-iphonesimulator/StoryStitchStaging.app"
          xcrun simctl addmedia "$UDID" apps/app/e2e/fixtures/*.jpg apps/app/e2e/fixtures/*.heic
      - run: pnpm qa --target=ios
        env:
          # This runner can take over 3 minutes to start Maestro's test driver. Maestro's default is 2.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-qa-results
          # Maestro's own folder holds a screenshot of each failure.
          path: |
            qa-results/
            ~/.maestro/tests/

# Promote a commit that passed CI on main to production.
# Railway's production environment autodeploys the API from the `production` branch (migrations run first);
# web is deployed explicitly below because GITHUB_TOKEN pushes don't trigger workflows.
# The PRODUCTION_WEB_APP variable picks the web app: apps/web until it's set to `app`, the switch to the Expo app.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.4.0"
        required: true
      sha:
        description: "Commit on main to release (default: current main)"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # Read once, so the app that's graded is the app that's deployed.
      web_app: ${{ vars.PRODUCTION_WEB_APP || 'web' }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SHA_INPUT: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - id: resolve
        name: Resolve and verify commit
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then echo "Tag $VERSION already exists"; exit 1; fi
          SHA="$SHA_INPUT"
          [ -n "$SHA" ] || SHA=$(git rev-parse origin/main)
          SHA=$(git rev-parse "$SHA^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          CONCLUSION=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          [ "$CONCLUSION" = "success" ] || { echo "CI on $SHA is '$CONCLUSION', not success"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Re-run the full acceptance suite on the exact commit being released; production only moves if it passes.
  qa:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Real Postgres for the API's tests and migrations.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storystitch/web exec playwright install --with-deps chromium webkit
      - run: pnpm qa --target="$WEB_APP"
        env:
          WEB_APP: ${{ needs.resolve.outputs.web_app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results-${{ inputs.version }}
          path: qa-results/

  promote:
    needs: [resolve, qa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward production and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "$SHA:refs/heads/production"   # fails if not a fast-forward
          git tag -a "$VERSION" "$SHA" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes

  deploy-web:
    needs: [resolve, promote]
    # the called workflow can't get more than this job grants; the repo's default token is read-only
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      app: ${{ needs.resolve.outputs.web_app }}
      project: ${{ vars.PAGES_PROJECT }}
      ref: ${{ needs.resolve.outputs.sha }}
      branch: production
      api_url: ${{ vars.API_URL_PRODUCTION }}
      accounts: true
      layout_editor: true
      usage: true
    secrets: inherit

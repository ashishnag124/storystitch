# Reusable: build one Pages app (apps/web or apps/app) and deploy it to Cloudflare Pages.
# branch=main -> preview alias (staging); branch=production -> production.
name: Deploy to Pages

on:
  workflow_call:
    inputs:
      app:
        description: "web or app"
        type: string
        required: true
      project:
        description: "Cloudflare Pages project name"
        type: string
        required: true
      ref:
        type: string
        required: true
      branch:
        type: string
        required: true
      api_url:
        type: string
        required: false
        default: ""
      accounts:
        description: "Build with accounts switched on (VITE_FEATURE_ACCOUNTS, EXPO_PUBLIC_FEATURE_ACCOUNTS)"
        type: boolean
        required: false
        default: false
      layout_editor:
        description: "Build with the layout editor switched on (VITE_FEATURE_LAYOUT_EDITOR, EXPO_PUBLIC_FEATURE_LAYOUT_EDITOR; needs accounts)"
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="@storystitch/${{ inputs.app }}..."
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_FEATURE_ACCOUNTS: ${{ inputs.accounts }}
          VITE_FEATURE_LAYOUT_EDITOR: ${{ inputs.layout_editor }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_FEATURE_ACCOUNTS: ${{ inputs.accounts }}
          EXPO_PUBLIC_FEATURE_LAYOUT_EDITOR: ${{ inputs.layout_editor }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # run inside the app, which pins wrangler: the action can't install it at a pnpm workspace root
          workingDirectory: apps/${{ inputs.app }}
          command: pages deploy dist --project-name=${{ inputs.project }} --branch=${{ inputs.branch }} --commit-hash=${{ inputs.ref }}

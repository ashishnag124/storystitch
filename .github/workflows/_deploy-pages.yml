# Reusable: build the Expo app (apps/app) for the web and deploy it to Cloudflare Pages.
# branch=main -> preview alias (staging); branch=production -> production.
name: Deploy to Pages

on:
  workflow_call:
    inputs:
      project:
        description: "Cloudflare Pages project name"
        type: string
        required: true
      ref:
        type: string
        required: true
      branch:
        type: string
        required: true
      api_url:
        type: string
        required: false
        default: ""
      accounts:
        description: "Build with accounts switched on (EXPO_PUBLIC_FEATURE_ACCOUNTS)"
        type: boolean
        required: false
        default: false
      layout_editor:
        description: "Build with the layout editor switched on (EXPO_PUBLIC_FEATURE_LAYOUT_EDITOR; needs accounts)"
        type: boolean
        required: false
        default: false
      usage:
        description: "Build with usage counts switched on (EXPO_PUBLIC_FEATURE_USAGE; needs an API)"
        type: boolean
        required: false
        default: false
      fit_layouts:
        description: "Build with grid layouts fitting their lines to the photos (EXPO_PUBLIC_FEATURE_FIT_LAYOUTS)"
        type: boolean
        required: false
        default: false
      admin:
        description: "Build with the /admin dashboard switched on (EXPO_PUBLIC_FEATURE_ADMIN; needs accounts, and the API's ADMIN_ENABLED to show anything)"
        type: boolean
        required: false
        default: false
      blank_layout:
        description: "Build with the blank layout switched on (EXPO_PUBLIC_FEATURE_BLANK_LAYOUT; needs the layout editor)"
        type: boolean
        required: false
        default: false
      blur_fill:
        description: "Build with the blurred cell fill switched on (EXPO_PUBLIC_FEATURE_BLUR_FILL)"
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="@storystitch/app..."
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_FEATURE_ACCOUNTS: ${{ inputs.accounts }}
          EXPO_PUBLIC_FEATURE_LAYOUT_EDITOR: ${{ inputs.layout_editor }}
          EXPO_PUBLIC_FEATURE_USAGE: ${{ inputs.usage }}
          EXPO_PUBLIC_FEATURE_FIT_LAYOUTS: ${{ inputs.fit_layouts }}
          EXPO_PUBLIC_FEATURE_ADMIN: ${{ inputs.admin }}
          EXPO_PUBLIC_FEATURE_BLANK_LAYOUT: ${{ inputs.blank_layout }}
          EXPO_PUBLIC_FEATURE_BLUR_FILL: ${{ inputs.blur_fill }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # run inside the app, which pins wrangler: the action can't install it at a pnpm workspace root
          workingDirectory: apps/app
          command: pages deploy dist --project-name=${{ inputs.project }} --branch=${{ inputs.branch }} --commit-hash=${{ inputs.ref }}

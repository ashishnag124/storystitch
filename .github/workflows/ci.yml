name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # Real Postgres for the API's tests and migrations.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storystitch/web exec playwright install --with-deps chromium webkit
      # Lint, typecheck, unit + end-to-end tests, and every criterion in docs/acceptance-criteria.md.
      - run: pnpm qa
      # The Expo app's iOS bundle: shows it still builds, long before there's an iOS app to run it in.
      - run: pnpm --filter @storystitch/app run build:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa-results/

  deploy-web-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # the called workflow can't get more than this job grants; the repo's default token is read-only
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      app: web
      # A separate Pages project whose production branch is `main`, so staging.storystitch.ashishnag.com can point at it
      # with an ordinary CNAME (Pages routes custom domains to a branch only through Cloudflare-proxied DNS).
      project: ${{ vars.PAGES_PROJECT_STAGING }}
      ref: ${{ github.sha }}
      branch: main
      api_url: ${{ vars.API_URL_STAGING }}
      # Accounts are on in staging only until they're switched on for production.
      accounts: true
      layout_editor: true
    secrets: inherit

  # The Expo app replacing apps/web, at its own address until it matches: next-staging.storystitch.ashishnag.com.
  deploy-app-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      app: app
      project: ${{ vars.PAGES_PROJECT_APP_STAGING }}
      ref: ${{ github.sha }}
      branch: main
      api_url: ${{ vars.API_URL_STAGING }}
      accounts: true
      layout_editor: true
    secrets: inherit

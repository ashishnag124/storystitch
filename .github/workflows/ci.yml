name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  deploy-web-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # the called workflow can't get more than this job grants; the repo's default token is read-only
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      app: web
      project: ${{ vars.PAGES_PROJECT }}
      ref: ${{ github.sha }}
      branch: main
    secrets: inherit

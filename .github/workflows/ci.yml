name: CI

# Fast tier (`fast`): every pull request. Slow tier (`check`, the full acceptance suite): pull requests into main,
# pushes to main, nightly on dev, and pull requests labeled run-sim. Promote dev to main to reach the slow tier.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # docs/acceptance-criteria.md stays in: `pnpm qa` grades it.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "docs/acceptance-criteria.md"
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'run-sim')
    runs-on: ubuntu-24.04
    # Usually 5 to 9 minutes, but a slow `playwright install` has passed at 31. A stuck one sat for over 45.
    timeout-minutes: 35
    # Real Postgres for the API's tests and migrations.
    services: &postgres
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env: &db
      DATABASE_URL: postgres://app:app@localhost:5432/app
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs start on main, the default branch. Nightly is for what hasn't been promoted yet.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storystitch/web exec playwright install --with-deps chromium webkit
      # Lint, typecheck, unit + end-to-end tests, and every criterion in docs/acceptance-criteria.md. Staging runs the
      # Expo app, so that's what's graded here. release.yml grades apps/web until production moves too.
      - run: pnpm qa --target=app
      # The Expo app's iOS bundle: shows it still builds, long before there's an iOS app to run it in.
      - run: pnpm --filter @storystitch/app run build:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa-results/

  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Usually about 2 minutes.
    timeout-minutes: 10
    services: *postgres
    env: *db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @storystitch/app run build:ios

  deploy-web-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # the called workflow can't get more than this job grants; the repo's default token is read-only
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      app: app
      # A separate Pages project whose production branch is `main`, so staging.storystitch.ashishnag.com can point at it
      # with an ordinary CNAME (Pages routes custom domains to a branch only through Cloudflare-proxied DNS).
      project: ${{ vars.PAGES_PROJECT_STAGING }}
      ref: ${{ github.sha }}
      branch: main
      api_url: ${{ vars.API_URL_STAGING }}
      # Accounts are on in staging only until they're switched on for production.
      accounts: true
      layout_editor: true
    secrets: inherit
